# API Gateway (SPEC 8.2): ponto único de entrada na porta 8080, serve a interface web e
# encaminha a API ao serviço responsável. Conexões persistentes com os serviços (keepalive,
# HTTP/1.1) e sem log de acesso, com as mesmas opções do controle "monolito + gateway".
# O resolver do Docker é consultado periodicamente, então réplicas novas
# (docker compose up --scale agendamento=2) e serviços reiniciados são encontrados.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream autenticacao { zone autenticacao 64k; server autenticacao:8080 resolve; keepalive 16; }
upstream clientes     { zone clientes 64k;     server clientes:8080 resolve;     keepalive 16; }
upstream catalogo     { zone catalogo 64k;     server catalogo:8080 resolve;     keepalive 16; }
upstream agendamento  { zone agendamento 64k;  server agendamento:8080 resolve;  keepalive 64; }
upstream pagamentos   { zone pagamentos 64k;   server pagamentos:8080 resolve;   keepalive 16; }

server {
    listen 8080;
    server_name _;
    access_log off;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript application/json;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;

    # Mesmo formato de erro do monolito para rotas inexistentes.
    error_page 404 = @nao_encontrado;

    location ^~ /internal/ { return 404; }
    location ^~ /api/ {
        default_type application/json;
        return 404 '{"erro":"Rota da API não encontrada.","codigo":"NAO_ENCONTRADO"}';
    }

    location /auth/ { proxy_pass http://autenticacao; }
    location /clientes { proxy_pass http://clientes; }
    location /barbeiros { proxy_pass http://catalogo; }
    location /servicos { proxy_pass http://catalogo; }
    location /configuracao/ { proxy_pass http://agendamento; }
    location /disponibilidade { proxy_pass http://agendamento; }
    location /estatisticas { proxy_pass http://agendamento; }
    location ~ ^/agendamentos/[^/]+/pagamento$ { proxy_pass http://pagamentos; }
    location /agendamentos { proxy_pass http://agendamento; }
    location = /health { proxy_pass http://agendamento; }

    location / {
        add_header X-Content-Type-Options nosniff;
        try_files $uri $uri/ =404;
    }

    location @nao_encontrado {
        default_type application/json;
        return 404 '{"erro":"Registro não encontrado.","codigo":"NAO_ENCONTRADO"}';
    }
}
