server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /auth/ { proxy_pass http://autenticacao:8080; }
    location /clientes { proxy_pass http://clientes:8080; }
    location /barbeiros { proxy_pass http://catalogo:8080; }
    location /servicos { proxy_pass http://catalogo:8080; }
    location /configuracao/ { proxy_pass http://agendamento:8080; }
    location /disponibilidade { proxy_pass http://agendamento:8080; }
    location /estatisticas { proxy_pass http://agendamento:8080; }
    location ~ ^/agendamentos/[^/]+/pagamento$ { proxy_pass http://pagamentos:8080; }
    location /agendamentos/ { proxy_pass http://agendamento:8080; }
    location = /agendamentos { proxy_pass http://agendamento:8080; }
    location /health { proxy_pass http://agendamento:8080; }
    location / { try_files $uri $uri/ /index.html; }
}
