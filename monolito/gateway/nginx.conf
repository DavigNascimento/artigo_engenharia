# Gateway do controle "monolito + gateway". Mesmas opções de proxy do gateway dos
# microsserviços (keepalive, HTTP/1.1, sem log de acesso); a diferença é que todas as
# requisições, inclusive a interface web, seguem para o único processo do monolito.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream app {
    zone app 64k;
    server app:8080 resolve;
    keepalive 64;
}

server {
    listen 8080;
    server_name _;
    access_log off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;

    location / { proxy_pass http://app; }
}
